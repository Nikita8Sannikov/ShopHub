name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    needs:
      - client
      - server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build client image
        run: docker build -t shophub-client ./client

      - name: Build server image
        run: docker build -t shophub-server ./server

  push-images:
    name: Push Docker images
    runs-on: ubuntu-latest

    needs:
      - client
      - server
      - docker

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            letoiledunord/shophub-server:latest
            letoiledunord/shophub-server:${{ github.sha }}

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            letoiledunord/shophub-nginx:latest
            letoiledunord/shophub-nginx:${{ github.sha }}